<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarlac PDRRMO | Situational Report Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Stormy macOS Glassmorphism Palette */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b; /* Amber warning accent fits the weather theme */
            --glass-bg: rgba(15, 23, 42, 0.2); /* 80% Transparent */
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(0, 0, 0, 0.25);
            --sidebar-bg: rgba(10, 15, 30, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            /* Animated Weather Disturbance Background */
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f2027, #203a43);
            background-size: 400% 400%;
            animation: stormFront 20s ease infinite;
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Smooth rolling background animation */
        @keyframes stormFront {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-right: 1px solid var(--glass-border);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .profile {
            display: flex; align-items: center; gap: 15px; margin-bottom: 40px; padding-left: 10px;
        }

            width: 48px; height: 48px; background: linear-gradient(135deg, #f59e0b, #d97706);
