<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarlac PDRRMO | Situational Report Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Stormy macOS Glassmorphism Palette */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b; 
            --glass-bg: rgba(15, 23, 42, 0.2); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(0, 0, 0, 0.25);
            --sidebar-bg: rgba(10, 15, 30, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            /* Animated Weather Disturbance Background */
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f2027, #203a43);
            background-size: 400% 400%;
            animation: stormFront 20s ease infinite;
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        @keyframes stormFront {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-right: 1px solid var(--glass-border);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .profile {
            display: flex; align-items: center; gap: 15px; margin-bottom: 40px; padding-left: 10px;
        }
        .profile-img {
            width: 48px; height: 48px; background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: 600; font-size: 18px; color: white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        .profile-info h4 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
        .profile-info p { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px;}

        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .nav-item {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 18px; border-radius: 14px;
            color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;
            font-size: 14px; font-weight: 500;
        }
        .nav-item:hover { background: var(--glass-hover); color: var(--text-main); }
        .nav-item.active {
            background: var(--glass-bg); color: var(--text-main);
            border: 1px solid var(--glass-border); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* --- Main Content Styles --- */
        .main-content { 
            flex: 1; padding: 50px 60px; overflow-y: auto; 
            scroll-behavior: smooth;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 12px; }
        
        .top-agency-select {
            background: var(--input-bg); color: var(--text-main); border: 1px solid var(--glass-border);
            padding: 10px 15px; border-radius: 12px; font-size: 14px; outline: none; appearance: none;
            cursor: pointer; min-width: 200px; transition: 0.3s;
        }
        .top-agency-select:focus { border-color: var(--accent); }
        select option, select optgroup { background: #1e293b; color: white; font-family: 'Inter', sans-serif;} 

        /* Conditional LGU Dropdown Fix (No more ghost clicks!) */
        #lguSelectContainer {
            display: none; /* Completely hidden from the layout by default */
            align-items: center; 
            gap: 10px;
            opacity: 0;
        }
        #lguSelectContainer.visible {
            display: flex; /* Brings it into layout only when active */
            opacity: 1;
            animation: fadeIn 0.3s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

        /* Mac OS style boxes */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        .card.full-width { grid-column: span 2; }

        .card-title {
            font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--accent); margin-bottom: 25px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }

        /* --- Seamless Row Inputs --- */
        .input-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0; border-bottom: 1px solid var(--glass-border);
        }
        .input-row:last-child { border-bottom: none; padding-bottom: 0; }
        .input-row label { font-size: 13px; color: var(--text-muted); font-weight: 500; flex: 1; }
        .input-row input {
            flex: 1; background: transparent; border: none; color: var(--text-main);
            font-size: 14px; text-align: right; outline: none; transition: color 0.2s;
        }
        .input-row input::placeholder { color: rgba(255, 255, 255, 0.2); }
        .input-row input:focus { color: var(--accent); }

        /* --- Block Inputs --- */
        .input-block { margin-bottom: 20px; }
        .input-block:last-child { margin-bottom: 0; }
        .input-block label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 10px; font-weight: 500;}
        .input-block textarea {
            width: 100%; background: var(--input-bg); border: 1px solid transparent;
            color: var(--text-main); font-size: 14px; padding: 15px; border-radius: 16px;
            resize: vertical; min-height: 80px; outline: none; transition: 0.3s;
        }
        .input-block textarea:focus { border-color: rgba(245, 158, 11, 0.5); background: rgba(0,0,0,0.4); }

        /* --- Activities Pills --- */
        .activities-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .activity-pill {
            background: var(--input-bg); border: 1px solid transparent;
            padding: 10px 18px; border-radius: 30px; font-size: 13px;
            color: var(--text-muted); cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px; user-select: none;
        }
        .activity-pill:hover { background: var(--glass-hover); }
        .activity-pill.active {
            background: rgba(245, 158, 11, 0.15); border-color: var(--accent); color: var(--accent);
        }
        .activity-pill input { display: none; }

        /* --- OCR Scanner UI --- */
        .scanner-area {
            border: 2px dashed rgba(245, 158, 11, 0.3); border-radius: 16px;
            padding: 40px; text-align: center; cursor: pointer; transition: 0.3s;
            background: rgba(0,0,0,0.15);
        }
        .scanner-area:hover { background: rgba(0,0,0,0.3); border-color: var(--accent); }
        .scanner-icon { color: var(--accent); margin-bottom: 15px; }

        /* --- Buttons --- */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #d97706);
            color: white; border: none; padding: 15px 30px; border-radius: 14px;
            font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.3s;
            float: right; margin-top: 30px; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.2);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(245, 158, 11, 0.4); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="profile">
            <div class="profile-img">T</div>
            <div class="profile-info">
                <p>Monitoring Center</p>
                <h4>Tarlac PDRRMO</h4>
            </div>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item active"><i data-lucide="layout-dashboard"></i> Dashboard</li>
            <li class="nav-item"><i data-lucide="file-text"></i> Compile Reports</li>
            <li class="nav-item"><i data-lucide="users"></i> Agency Records</li>
            <li class="nav-item"><i data-lucide="settings"></i> Settings</li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="header">
            <div>
                <h1>Situational Report</h1>
                
                <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label style="font-size: 13px; color: var(--text-muted); font-weight: 500;">Reporting Agency:</label>
                        <select class="top-agency-select" id="mainReportingAgency">
                            <option value="PDRRMO">PDRRMO (Provincial)</option>
                            <option value="MDRRMO">MDRRMO / CDRRMO (LGU)</option>
                            <option value="BFP">BFP</option>
                            <option value="PNP">PNP</option>
                            <option value="DSWD">DSWD</option>
                            <option value="PHO">Provincial Health Office (PHO)</option>
                            <option value="AGRICULTURE">Department of Agriculture</option>
                            <option value="PSWDO">PSWDO</option>
                            <option value="OTHER">Other...</option>
                        </select>
                    </div>

                    <div id="lguSelectContainer">
                        <i data-lucide="chevron-right" style="color: var(--text-muted); width: 16px;"></i>
                        <select class="top-agency-select" id="lguSelect">
                            <option value="" disabled selected>Select Municipality/City...</option>
                            <optgroup label="City (CDRRMO)">
                                <option value="Tarlac City">Tarlac City</option>
                            </optgroup>
                            <optgroup label="Municipalities (MDRRMO)">
                                <option value="Anao">Anao</option>
                                <option value="Bamban">Bamban</option>
                                <option value="Camiling">Camiling</option>
                                <option value="Capas">Capas</option>
                                <option value="Concepcion">Concepcion</option>
                                <option value="Gerona">Gerona</option>
                                <option value="La Paz">La Paz</option>
                                <option value="Mayantoc">Mayantoc</option>
                                <option value="Moncada">Moncada</option>
                                <option value="Paniqui">Paniqui</option>
                                <option value="Pura">Pura</option>
                                <option value="Ramos">Ramos</option>
                                <option value="San Clemente">San Clemente</option>
                                <option value="San Jose">San Jose</option>
                                <option value="San Manuel">San Manuel</option>
                                <option value="Santa Ignacia">Santa Ignacia</option>
                                <option value="Victoria">Victoria</option>
                            </optgroup>
                        </select>
                    </div>

                </div>
            </div>
            
            <div style="text-align: right;">
                <label style="font-size: 12px; color: var(--text-muted); font-weight: 500; display: block; margin-bottom: 5px;">Report As Of:</label>
                <input type="datetime-local" style="background: var(--input-bg); border: none; color: white; padding: 10px 15px; border-radius: 10px; outline: none; font-family: 'Inter', sans-serif;">
            </div>
        </div>

        <form id="sitrepForm">
            <div class="dashboard-grid">
                
                <div class="card">
                    <div class="card-title"><i data-lucide="cloud-rain"></i> General Status</div>
                    <div class="input-row">
                        <label>a. Weather Condition</label>
                        <input type="text" placeholder="Tap to type...">
                    </div>
                    <div class="input-row">
                        <label>b. Affected Population</label>
                        <input type="text" placeholder="Tap to type...">
                    </div>
                    <div class="input-row">
                        <label>c. Forced Evacuation</label>
                        <input type="text" placeholder="Tap to type...">
                    </div>
                    <div class="input-row">
                        <label>d. Casualty</label>
                        <input type="text" placeholder="E.G., ZERO CASUALTIES">
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><i data-lucide="alert-triangle"></i> Damages & Interruptions</div>
                    <div class="input-row">
                        <label>e. Class/Work Suspension</label>
                        <input type="text" placeholder="Tap to type...">
                    </div>
                    <div class="input-row">
                        <label>f. Flooded Areas</label>
                        <input type="text" placeholder="Tap to type...">
                    </div>
                    <div class="input-row">
                        <label>j. Power & Water</label>
                        <input type="text" placeholder="Tap to type...">
                    </div>
                    <div class="input-row">
                        <label>k. Other Incidents</label>
                        <input type="text" placeholder="Tap to type...">
                    </div>
                </div>

                <div class="card full-width">
                    <div class="card-title"><i data-lucide="map-pin"></i> Critical Damages</div>
                    <div class="dashboard-grid">
                        <div class="input-block">
                            <label>g. Damages on Infrastructure</label>
                            <textarea placeholder="Provide detailed infrastructure report here..."></textarea>
                        </div>
                        <div class="input-block">
                            <label>h. Damages on Agriculture (Auto-fills via OCR)</label>
                            <textarea placeholder="Provide detailed agricultural damage report here..."></textarea>
                        </div>
                        <div class="input-block full-width" style="grid-column: span 2;">
                            <label>i. Status of Roads and Bridges</label>
                            <textarea placeholder="Report on road passability and bridge structural integrity..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><i data-lucide="scan-line"></i> External Data Scanner</div>
                    <select class="top-agency-select" style="width: 100%; margin-bottom: 20px;">
                        <option value="agri">Agriculture (Crop Damage Table)</option>
                        <option value="pho">Provincial Health Office (PHO Table)</option>
                        <option value="pswdo">PSWDO Report</option>
                        <option value="custom">+ Add / Edit Custom Format...</option>
                    </select>
                    
                    <div class="scanner-area">
                        <i data-lucide="image-plus" class="scanner-icon" width="36" height="36"></i>
                        <p style="font-size: 14px; font-weight: 500; color: var(--text-main);">Drop document image here</p>
                        <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">JPEG or PNG (Tables auto-extract)</p>
                        <input type="file" id="fileUpload" style="display: none;" accept="image/*">
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><i data-lucide="activity"></i> Other Activities Monitored</div>
                    <div class="activities-container">
                        <label class="activity-pill">
                            <input type="checkbox"> <i data-lucide="check-circle" width="14" height="14"></i> EOC Activated 24/7
                        </label>
                        <label class="activity-pill">
                            <input type="checkbox"> <i data-lucide="check-circle" width="14" height="14"></i> MDRRMC Convened
                        </label>
                        <label class="activity-pill">
                            <input type="checkbox"> <i data-lucide="check-circle" width="14" height="14"></i> PAGASA Monitored
                        </label>
                        <label class="activity-pill">
                            <input type="checkbox"> <i data-lucide="check-circle" width="14" height="14"></i> Barangay Coordination
                        </label>
                        <label class="activity-pill">
                            <input type="checkbox"> <i data-lucide="check-circle" width="14" height="14"></i> Validating Houses
                        </label>
                        <label class="activity-pill">
                            <input type="checkbox"> <i data-lucide="check-circle" width="14" height="14"></i> Goods Prepositioned
                        </label>
                    </div>
                    <div class="input-row" style="margin-top: 20px; border-bottom: none;">
                        <input type="text" placeholder="+ TYPE CUSTOM ACTIVITY AND PRESS ENTER..." style="text-align: left; background: var(--input-bg); padding: 12px 15px; border-radius: 12px;">
                    </div>
                </div>

            </div>
            
            <button type="button" class="btn-primary" onclick="alert('Google Sheets Sync Triggered')">
                <i data-lucide="send" style="width: 16px; height: 16px; display: inline; vertical-align: middle; margin-right: 5px;"></i> Log to Database
            </button>
        </form>
    </main>

    <script>
        lucide.createIcons();

        // --- Dynamic LGU Dropdown Logic ---
        const mainAgencySelect = document.getElementById('mainReportingAgency');
        const lguSelectContainer = document.getElementById('lguSelectContainer');
        const lguSelect = document.getElementById('lguSelect');

        mainAgencySelect.addEventListener('change', function() {
            if (this.value === 'MDRRMO') {
                lguSelectContainer.classList.add('visible');
                lguSelect.required = true;
            } else {
                lguSelectContainer.classList.remove('visible');
                lguSelect.required = false;
                lguSelect.value = ''; // Reset the value if they switch away
            }
        });

        // --- Auto-Uppercase Feature ---
        const textInputs = document.querySelectorAll('input[type="text"], textarea');
        textInputs.forEach(input => {
            input.addEventListener('input', function() {
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.toUpperCase();
                this.setSelectionRange(start, end);
            });
        });

        // --- Scanner Trigger ---
        const scannerArea = document.querySelector('.scanner-area');
        const fileUpload = document.getElementById('fileUpload');
        scannerArea.addEventListener('click', () => { fileUpload.click(); });

        // --- Pill Button Toggle Logic ---
        const pills = document.querySelectorAll('.activity-pill');
        pills.forEach(pill => {
            pill.addEventListener('change', function(e) {
                if(e.target.checked) {
                    this.classList.add('active');
                } else {
                    this.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
