<script>
    document.getElementById('sitrepForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevents the page from refreshing

        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
        const scriptURL = 'YOUR_WEB_APP_URL_HERE'; 

        // 1. Gather all checked "Other Activities"
        const checkedActivities = Array.from(document.querySelectorAll('input[name="activities"]:checked'))
                                       .map(cb => cb.value);
        
        // 2. Add the manual custom activity if the user typed one
        const manualAct = document.getElementById('manualActivity').value;
        if(manualAct) {
            checkedActivities.push(manualAct);
        }

        // 3. Package the data into a JSON object
        const payload = {
            reportTime: document.getElementById('reportTime').value,
            weatherCondition: document.getElementById('weatherCondition').value,
            affectedPopulation: document.getElementById('affectedPopulation').value,
            evacuation: document.getElementById('evacuation').value,
            casualty: document.getElementById('casualty').value,
            suspension: document.getElementById('suspension').value,
            floodedAreas: document.getElementById('floodedAreas').value,
            infrastructure: document.getElementById('infrastructure').value,
            agriculture: document.getElementById('agriculture').value,
            roadsBridges: document.getElementById('roadsBridges').value,
            powerWater: document.getElementById('powerWater').value,
            otherIncidents: document.getElementById('otherIncidents').value,
            activities: checkedActivities.join(" | ") // Joins them into one string for the spreadsheet
        };

        // 4. Update the submit button so the user knows it's working
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.innerText = 'Submitting...';
        submitBtn.disabled = true;

        // 5. Send the data to Google Sheets
        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(payload),
            // Sending as plain text bypasses strict CORS policies from browsers
            headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                alert('Success! SITREP logged to Google Sheets.');
                document.getElementById('sitrepForm').reset(); // Clear the form
            } else {
                alert('Error logging to sheets: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Fetch Error:', error);
            alert('Failed to submit report. Please check your internet connection.');
        })
        .finally(() => {
            // Restore the button state
            submitBtn.innerText = 'Submit Report to Google Sheets';
            submitBtn.disabled = false;
        });
    });

    // Placeholder for OCR functionality
    document.getElementById('scanBtn').addEventListener('click', function() {
        const fileInput = document.getElementById('reportImage').files[0];
        if(!fileInput) { alert("Please upload an image first."); return; }
        document.getElementById('scanStatus').innerText = "Scanning document... (Tesseract.js integration pending)";
    });
</script>
